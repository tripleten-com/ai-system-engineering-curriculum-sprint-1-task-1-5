  # Task 1.5 — Step 2: 10x scale projections and resource math
  # Estimate retained storage from the supplied byte rate and retention inputs; identify the scope
  # of that estimate.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # scope options (use exact values):
  # - raw-payload-only-excludes-indexes-replication-and-overhead: Estimate raw payload storage,
  #   excluding indexes, replicas, and other overhead.
  # - fully-provisioned-production-storage: Treat the estimate as the full storage provision
  #   required for production.
  storage_calc:
    # Projected incoming raw payload volume, in bytes per second.
    # Number; absolute tolerance 0.001 in the named unit or factor.
    ingestion_bytes_per_second: null
    # Number of days of raw readings to retain.
    # Integer; the count must match exactly.
    retention_days: null
    # Number of seconds used to convert one day.
    # Integer; the count must match exactly.
    seconds_per_day: null
    # Raw payload volume retained over the specified period, in bytes.
    # Number; absolute tolerance 0.001 in the named unit or factor.
    retained_bytes: null
    # Retained volume, in decimal GB (1 GB = 1000000000 bytes).
    # Number; absolute tolerance 0.001 in the named unit or factor.
    retained_decimal_gb: null
    # Select the scope of this estimate or recommendation.
    # Choose one string from the scope options above.
    scope: null

  # Task 1.5 — Step 2: 10x scale projections and resource math
  # Record the service input, projected arrival rate, intermediate worker estimates, final count,
  # and calculation choices.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # rounding options (use exact values):
  # - ceil-once-after-one-margin: Apply one margin and then round upward to an integer once.
  # - ceil-before-margin: Round upward before applying the margin.
  # - round-nearest: Round to the nearest integer worker count.
  #
  # input_basis options (use exact values):
  # - pooled-worker-service-spans: Use total worker processing-span duration divided by the total
  #   span count.
  # - accepted-to-terminal-duration: Use elapsed time between acceptance and persistence of the
  #   terminal state.
  # - configured-delay-only: Use the provider delay setting as the service-time input.
  worker_count_calc:
    # Supplied pooled worker processing duration, in seconds per job; round to six decimals.
    # Number; absolute tolerance 0.000001 seconds/job.
    service_seconds_per_job: null
    # Projected exception arrival rate, in jobs per second.
    # Number; absolute tolerance 0.001 in the named unit or factor.
    arrival_jobs_per_second: null
    # Modeled worker demand before applying a margin or integer rounding.
    # Number; absolute tolerance 0.0001 workers.
    unmargined_workers: null
    # Planning margin as a fraction; for example, a percentage is divided by 100.
    # Number; absolute tolerance 0.000001 in the named unit or factor.
    margin_fraction: null
    # Modeled worker demand after applying the margin, before integer rounding.
    # Number; absolute tolerance 0.0001 workers.
    with_margin_workers: null
    # Final whole-number worker count.
    # Integer; the count must match exactly.
    required_workers: null
    # Select the method used to round the worker estimate.
    # Choose one string from the rounding options above.
    rounding: null
    # Select the evidence basis for the worker service-time input.
    # Choose one string from the input_basis options above.
    input_basis: null

  # Task 1.5 — Step 3: Authoring a structured architectural decision record
  # Recommend an action and scope using the supplied operating policy; select exactly four evidence
  # records.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # action options (use exact values):
  # - two-worker-pilot: Test a local configuration with two workers.
  # - admission-control-pilot: Test a local policy that limits or rejects incoming work.
  # - multi-region-platform-migration: Migrate the platform to infrastructure spanning multiple
  #   regions.
  #
  # scope options (use exact values):
  # - bounded-local-pilot-before-production-decision: Gather results from a limited local pilot
  #   before deciding on production changes.
  # - immediate-production-rollout: Proceed directly to a production rollout.
  #
  # evidence_ids options (use exact values):
  # - E51: Current baseline worker processing-span counts and duration sums.
  # - E52: Historical two-user capture and its measurement definitions.
  # - E53: Authored workload inputs and storage units.
  # - E54: Authored pilot policy and operating thresholds.
  # - E55: Runtime topology and fidelity description.
  # - E56: Definitions for component and end-to-end percentiles.
  scaling_recommendation:
    # Select the recommended action.
    # Choose one string from the action options above.
    action: null
    # Select the scope of this estimate or recommendation.
    # Choose one string from the scope options above.
    scope: null
    # Select the evidence records supporting this answer.
    # YAML list: choose 4 unique values from the evidence_ids options above; order does not matter.
    evidence_ids: null

  # Task 1.5 — Step 3: Authoring a structured architectural decision record
  # Complete the architectural decision record: context, decision, alternatives, consequence,
  # trigger, rollback condition, and next measurement. Use the supplied operating policy to keep the
  # selected decision and its conditions consistent.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # context options (use exact values):
  # - projected-load-exceeds-one-worker-model: The projected workload exceeds the capacity estimated
  #   for one worker.
  # - cloud-capacity-already-proven: Cloud capacity has already been established by the evidence.
  #
  # decision / alternatives options (use exact values):
  # - two-worker-pilot: Test a local configuration with two workers.
  # - admission-control-pilot: Test a local policy that limits or rejects incoming work.
  # - multi-region-platform-migration: Migrate the platform to infrastructure spanning multiple
  #   regions.
  #
  # consequences options (use exact values):
  # - duplicate-and-database-contention-risk: Risk of repeated side effects and competing database
  #   operations.
  # - admission-delay-and-rejection-risk: Risk of delayed or rejected incoming requests.
  # - production-capacity-guaranteed: The decision guarantees sufficient production capacity.
  #
  # action_trigger options (use exact values):
  # - projected-utilization-above-one: Projected offered load divided by modeled one-worker capacity
  #   exceeds 1.
  # - actual-arrivals-above-one-worker-modeled-rate: Observed arrival rate exceeds modeled
  #   one-worker service capacity.
  # - local-api-p95-below-one-second: The local API 95th-percentile latency is below one second.
  #
  # rollback_condition options (use exact values):
  # - duplicate-side-effects-or-db-p95-over-200ms: Roll back if duplicate side effects occur or
  #   database p95 exceeds 200 ms.
  # - rejection-over-1-percent-or-oldest-age-over-60s: Roll back if rejection exceeds 1% or oldest
  #   outstanding work exceeds 60 seconds.
  # - never-rollback: Do not roll back under any condition.
  #
  # next_measurement options (use exact values):
  # - two-worker-completions-queue-age-db-p95-duplicates: Measure completion rate, oldest
  #   outstanding age, database p95, and duplicate effects with two workers.
  # - admission-rejections-queue-age-completions: Measure admission rejections, oldest outstanding
  #   age, and completion rate.
  # - cloud-sla-from-local-runtime: Derive a cloud service-level guarantee from local runtime
  #   results.
  adr:
    # Select the situation motivating the decision.
    # Choose one string from the context options above.
    context: null
    # Select the action recorded in the architectural decision record.
    # Choose one string from the decision / alternatives options above.
    decision: null
    # Select the two alternatives considered alongside the decision.
    # YAML list: choose 2 unique values from the decision / alternatives options above; order does
    # not matter.
    alternatives: null
    # Select one consequence of the chosen decision.
    # YAML list: choose 1 unique value from the consequences options above; order does not matter.
    consequences: null
    # Select the condition that triggers the chosen action.
    # Choose one string from the action_trigger options above.
    action_trigger: null
    # Select the condition for reversing the chosen action.
    # Choose one string from the rollback_condition options above.
    rollback_condition: null
    # Select the measurement to take next.
    # Choose one string from the next_measurement options above.
    next_measurement: null
