  # Task 1.5 — Step 2: 10x scale projections and resource math
  # Calculate projected reading ingestion and byte volume from the supplied workload inputs.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  ingestion_rate_calc:
    # Supplied baseline sensor arrival rate, in readings per second.
    # Number; absolute tolerance 0.001 in the named unit or factor.
    baseline_readings_per_second: null
    # Supplied workload multiplier, expressed as a factor rather than a percentage.
    # Number; absolute tolerance 0.001 in the named unit or factor.
    growth_factor: null
