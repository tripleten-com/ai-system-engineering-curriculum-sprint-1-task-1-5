# Coldline - Task 1.5
# File: submission.yaml
# Edit only answer values in submission.yaml; keep the supplied keys and types.
# Empty strings, nulls, and placeholder text are incomplete and fail verification.
# Use submission-sample.yaml for YAML formatting only; do not copy its fictional values.
# Do not include secrets, personal data, or local absolute paths.
# Use docs/student/evidence-pack.json for assessed answers; retain your required local
# investigations for the final defense.

answers:

  # Task 1.5 — Step 1: Analyzing AI-generated capacity reviews
  # Review claims C01-C10 in docs/student/ai-capacity-report-draft.md. For each claim, classify its
  # accuracy, select the required evidence records, and choose its correction or retention option.
  # The quoted statements are claims to assess, not trusted findings.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # classification options (use exact values):
  # - supported: The supplied evidence supports the claim as written.
  # - calculation-error: The arithmetic, unit conversion, or use of the supplied formula is
  #   incorrect.
  # - measurement-definition-error: The claim treats a measurement as a different quantity from the
  #   one it measures.
  # - unsupported-assumption: The claim relies on an assumption that the supplied evidence does not
  #   establish.
  #
  # evidence_ids options (use exact values):
  # - E51: Current baseline worker processing-span counts and duration sums.
  # - E52: Historical two-user capture and its measurement definitions.
  # - E53: Authored workload inputs and storage units.
  # - E54: Authored pilot policy and operating thresholds.
  # - E55: Runtime topology and fidelity description.
  # - E56: Definitions for component and end-to-end percentiles.
  #
  # correction options (use exact values):
  # - use-accepted-to-terminal-duration: Describe the interval from acceptance to persistence of the
  #   terminal state.
  # - use-common-cutoff-outstanding-counts: Use accepted and terminal job counts taken at the same
  #   cutoff.
  # - separate-acceptance-completion-capacity: Distinguish incoming acceptance rate, completed-job
  #   rate, and capacity.
  # - convert-bytes-to-decimal-mb: Convert bytes to decimal megabytes using 1000000 bytes per MB.
  # - multiply-arrival-by-exception-fraction: Multiply the reading arrival rate by the fraction that
  #   creates exceptions.
  # - multiply-daily-storage-by-retention-days: Multiply daily raw storage by the number of retained
  #   days.
  # - apply-margin-once-then-ceiling: Apply the planning margin once, then round upward once to an
  #   integer.
  # - measure-correlated-end-to-end-percentile: Measure complete correlated request durations to
  #   obtain their percentile.
  # - limit-to-reversible-local-pilot: Limit the recommendation to a local experiment that can be
  #   rolled back.
  # - retain-as-planning-assumption: Retain the statement explicitly as a planning assumption.
  claim_audit:
